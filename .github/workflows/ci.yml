name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # GitHub Actions のランナーで Node.js 20 の非推奨警告に対応するため、Node.js 24 を強制的に使用するように設定します。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Run tests
        run: deno test -A
